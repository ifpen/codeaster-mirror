
name: Mirror Code_Aster

on:
  schedule:
    - cron: "17 2 * * 0"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Code_Aster branches and tags
        run: |
          git init repo
          cd repo

          git remote add upstream https://gitlab.com/codeaster/src.git

          git fetch upstream \
            '+refs/heads/main:refs/remotes/upstream/main' \
            '+refs/heads/v17:refs/remotes/upstream/v17'

          git fetch upstream --tags

      - name: Push branches to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          cd repo

          git remote add github \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git"

          git push github refs/remotes/upstream/main:refs/heads/main --force
          git push github refs/remotes/upstream/v17:refs/heads/v17 --force

      - name: Push tags to GitHub in batches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          cd repo

          git remote add github \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPOSITORY}.git" 2>/dev/null || true

          mapfile -t tags < <(git for-each-ref --format='%(refname)' refs/tags)

          total=${#tags[@]}
          batch_size=50

          echo "Nombre total de tags : $total"

          for ((i=0; i<total; i+=batch_size)); do
            batch=("${tags[@]:i:batch_size}")

            echo "Push des tags $((i+1)) à $((i+${#batch[@]})) sur $total"

            git push github --force "${batch[@]}"
          done

          echo "Synchronisation des tags terminée."
